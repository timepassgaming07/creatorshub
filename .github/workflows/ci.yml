name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo caches across jobs; without this every job re-runs identical work.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree, which
      # is the check that catches a dependency added without committing the lock.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # A package can build cleanly and still be unresolvable, if its manifest
      # advertises an entry point the build did not emit there. That happened
      # once: a widened rootDir moved every file down one directory while
      # typecheck, lint, test, and build all stayed green.
      - name: Verify advertised exports exist
        run: pnpm check:exports

  browser:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both Playwright projects are Chromium (desktop and Pixel 7), so only
      # that browser is downloaded. --with-deps installs the system libraries
      # the runner image does not ship.
      - name: Install Chromium
        run: pnpm --filter @creatorhub/web exec playwright install --with-deps chromium

      # The axe checks run inside this suite rather than as a separate job. A
      # second job would rebuild the app to re-run a subset of the same specs;
      # a failure blocks the merge either way, and the report names which.
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Testcontainers starts its own Postgres against the Docker daemon the
      # runner already provides, so there is no services: block and no second
      # place the image tag is written. A drift test fails the build if the
      # tag here and the one in docker-compose.yml ever disagree.
      # See docs/adr/0015-local-postgres.md.
      - name: Integration tests
        run: pnpm test:integration

      # Item 1.5. Fails the build when any table lacks workspace_id, lacks an
      # RLS policy, or has RLS enabled without FORCE. It reads the catalogue of
      # a freshly migrated database rather than the Drizzle schema, so a table
      # created by hand-written SQL or by the auth library is still checked.
      - name: Tenancy enforcement
        run: pnpm check:tenancy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on high and critical only. Blocking a money-path fix on a low
      # advisory in a dev dependency trains people to bypass the gate.
      - name: Audit
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Scan history, not just the tip. A secret committed and then removed
          # in a later commit is still a leaked secret.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
